[package]
name = "fjall-schema-spike"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false
license = "MIT"
description = "Experimental flat compiled YANG schema index and XPath cursor adapter"

[dependencies]
xpath1 = { path = "../..", default-features = false }
fjall = { version = "=3.1.10", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
criterion = { version = "=0.5.1", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "schema"
harness = false
