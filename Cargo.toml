[package]
name = "xpath1"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
description = "XPath 1.0 over application-defined trees, with a Jaxen conformance corpus"
license = "MIT"
readme = "README.md"
exclude = [".superpowers", "target"]

[features]
default = ["xml"]
xml = ["dep:roxmltree"]

[dependencies]
roxmltree = { version = "0.20", optional = true }

[dev-dependencies]
roxmltree = "0.20"
criterion = { version = "=0.5.1", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "xpath"
harness = false

[[test]]
name = "jaxen"
required-features = ["xml"]

[[example]]
name = "xml"
required-features = ["xml"]

[[example]]
name = "yang"
required-features = ["xml"]
